name: ASTRA Sep22-28 data-only acquisition
on:
  push:
    branches: [astra-data-sep22-28-20261001]
    paths: ['.github/workflows/astra-sep22-28-data.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [eurusd, gbpusd, usdjpy, gbpjpy, audusd, usdcad, xauusd, xagusd]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch public M1 source without strategy execution
        shell: bash
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          out="source/${SYMBOL}"
          mkdir -p "$out"
          ver="$(npm view dukascopy-node version)"
          printf '%s\n' "$ver" > "$out/DOWNLOADER_VERSION.txt"
          for side in bid ask; do
            npx --yes "dukascopy-node@${ver}" \
              -i "$SYMBOL" -from 2026-09-21 -to 2026-09-29 \
              -t m1 -p "$side" -v -fl -f csv \
              -dir "$out" -fn "${SYMBOL}_${side}_m1" \
              --batch-size 2 --batch-pause 800
          done
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          from datetime import datetime, timezone
          s=os.environ['SYMBOL']; out=Path('source')/s
          records=[]
          for side in ('bid','ask'):
              p=out/f'{s}_{side}_m1.csv'
              with p.open() as f:
                  rows=list(csv.DictReader(f))
              assert rows, f'empty {side}'
              ts=[int(float(r['timestamp'])) for r in rows]
              assert ts==sorted(ts) and len(ts)==len(set(ts))
              assert min(ts)>=int(datetime(2026,9,21,tzinfo=timezone.utc).timestamp()*1000)
              assert max(ts)<int(datetime(2026,9,29,tzinfo=timezone.utc).timestamp()*1000)
              counts={}
              for t in ts:
                  d=datetime.fromtimestamp(t/1000,timezone.utc).date().isoformat()
                  counts[d]=counts.get(d,0)+1
              for r in rows:
                  o,h,l,c=(float(r[k]) for k in ('open','high','low','close'))
                  assert 0<l<=min(o,c)<=max(o,c)<=h
              records.append({'symbol':s,'side':side,'rows':len(rows),'first':ts[0],'last':ts[-1],
                              'per_utc_day':counts,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          payload={'acquired_at_utc':datetime.now(timezone.utc).isoformat(),'source':'Dukascopy public datafeed',
                   'download_from_inclusive':'2026-09-21','download_to_exclusive':'2026-09-29',
                   'no_strategy_or_trading_execution':True,'local_gap_filling':False,'files':records}
          (out/'MANIFEST.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-sep22-28-${{ matrix.symbol }}-bidask-m1
          path: source/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 7
