name: Rithal Tail Guard V6.5.8

on:
  push:
    branches: [rithal-tail-guard-v6.5.8]
  pull_request:
    paths:
      - 'rithal_tail_guard_v6_5_8/**'
      - '.github/workflows/rithal-tail-guard-v6-5-8.yml'

jobs:
  anchored-clock-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V6.5.8 delta
        run: python -m py_compile rithal_tail_guard_v6_5_8/rithal_tail_guard_v658_freshness.py
      - name: Run one-bar long-run simulation
        run: python rithal_tail_guard_v6_5_8/rithal_tail_guard_v658_freshness.py --self-test
      - name: Parse installer
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content rithal_tail_guard_v6_5_8/Install-RithalTailGuardV6_5_8.ps1 -Raw))
      - name: Assert clock ownership contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('rithal_tail_guard_v6_5_8/rithal_tail_guard_v658_freshness.py').read_text()
          for token in (
              'RITHAL_TAIL_GUARD_V6_5_8_ANCHORED_FRESHNESS',
              'anchored_latest_bar_age_min',
              'wall_clock_latest_bar_age_min',
              'anchor_now_ms',
              'one_bar_rollover_reproduced',
          ):
              assert token in text, token
          assert 'AGE_NEW' in text
          print('anchored freshness ownership PASS')
          PY

  windows-cumulative-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Build synthetic restored project
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-v658'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'data_lake\manifests')|Out-Null
          @'
          from pathlib import Path
          from types import MethodType
          from typing import Any,Dict,List,Sequence
          import hashlib,importlib.util,json,os,sqlite3,sys
          import numpy as np
          import pandas as pd
          BAR_MS=900000
          DAY_BARS=96
          MAX_ROLLING_BARS=2880
          DEFAULT_WARMUP_BARS=3200
          DEFAULT_REPLACE_BARS=96
          DEFAULT_LIVE_ROWS=16384
          PARITY_EXCLUDE={"btc_regime","eth_regime"}
          ONE_FEATURE_COLS=[]
          AGG_FEATURE_COLS=[]
          class ContextState: pass
          def normalize_timestamp_ms(d): return d
          def load_engine_module(p): pass
          def read_frame(p): pass
          def make_plan(*a,**k): pass
          def compare_parity(*a,**k): pass
          def patch_microstructure_contract(*a,**k): pass
          def atomic_write_parquet(*a,**k): pass
          def _validate_grid(*a,**k): pass
          def _schema_hash(*a,**k): pass
          def sha256_file(*a,**k): pass
          def stage_incremental_live_outputs(*,engine_path,data_root,canonical_enriched_dir,live_enriched_dir,live_cache_dir,symbols,stage_dir,expected_latest_ms,raw_refresh_start_ms,requested_replace_start_ms,warmup_bars=3200,replace_rows_minimum=96,max_live_rows=16384,parity_rows=96): return {}
          def initialize_live_overlay_from_canonical(): pass
          '@|Set-Content (Join-Path $root 'mythos_incremental_enricher_v6_5.py') -Encoding utf8
          @'
          from pathlib import Path
          from typing import Any,Dict,List,Mapping,Optional,Sequence,Tuple
          import argparse,json,os,shutil,sys,time
          import numpy as np
          import pandas as pd
          BAR_15M_MS=900000
          BINANCE_FAPI='x'
          class JsonClient: pass
          def fetch_binance_premium(client,symbol,start_ms,end_open_ms): return pd.DataFrame()
          def _as_float(value,default=0.0): return default
          def tail_ratios(*a,**k): return {}
          def placeholder():
              report={"guard_version":"6.5.3"}; staged_report={}; symbols=[]; live_enriched_dir=Path('.'); anchor_now_ms=0
              class Args: max_latest_age_minutes=35.0
              args=Args(); status={}
              report["rebuild_mode"] = "INCREMENTAL_BOUNDED_LIVE_OVERLAY"
              report["tail_status"] = {symbol: tail_ratios(live_enriched_dir, symbol, n=96) for symbol in symbols}
              report["preferred_tail_contract_ok"] = bool(all(
                  True for status in report["tail_status"].values()
              ))
              ok = (
                  True
                  and float(status.get("latest_bar_age_min", 1e9)) <= float(args.max_latest_age_minutes)
              )
              return report,ok
          '@|Set-Content (Join-Path $root 'mythos_live_tail_guard_v6_6.py') -Encoding utf8
          @'
          $ErrorActionPreference="Stop"
          $root=$PSScriptRoot
          $bridge=Join-Path $root "mythos_agg_archive_bridge_v6_5_4.py"
          $normalizer=Join-Path $root "mythos_normalize_agg_schema_v6_5_5.py"
          $core=Join-Path $root "Start-RithalTailWatchV6_5_3_Core.ps1"
          & $core @args
          exit $LASTEXITCODE
          '@|Set-Content (Join-Path $root 'Start-RithalTailWatch.ps1') -Encoding utf8
          "raise SystemExit(0)"|Set-Content (Join-Path $root 'mythos_agg_archive_bridge_v6_5_4.py') -Encoding utf8
          "raise SystemExit(0)"|Set-Content (Join-Path $root 'mythos_normalize_agg_schema_v6_5_5.py') -Encoding utf8
          @'
          param([string]$ProjectRoot=$PSScriptRoot,[switch]$Once,[switch]$Bootstrap,[switch]$Background,[switch]$NoRunNow)
          $dir=Join-Path $PSScriptRoot 'data_lake\manifests';New-Item -ItemType Directory -Force -Path $dir|Out-Null
          $now=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds();$step=[int64]900000;$latest=$now-($now%$step)-$step
          $status=@{}
          foreach($s in @('BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','ADAUSDT','AVAXUSDT')){$status[$s]=@{anchored_latest_bar_age_min=25.0;wall_clock_latest_bar_age_min=40.0}}
          @{publication_transaction='COMMITTED';tail_feature_contract_ok=$true;latest_closed_15m_open_ms=$latest;tail_status=$status}|ConvertTo-Json -Depth 10|Set-Content (Join-Path $dir 'live_tail_guard_v6_5_report.json') -Encoding utf8
          exit 0
          '@|Set-Content (Join-Path $root 'Start-RithalTailWatchV6_5_3_Core.ps1') -Encoding utf8
      - name: Install cumulative V6.5.8 and require committed bootstrap
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-v658'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\rithal_tail_guard_v6_5_8\Install-RithalTailGuardV6_5_8.ps1 -ProjectRoot $root -RunBootstrap
      - name: Verify installed clock contract
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-v658'
          & (Join-Path $root 'Verify-RithalTailGuardV6_5_8.ps1') -ProjectRoot $root
          $guard=Get-Content (Join-Path $root 'mythos_live_tail_guard_v6_6.py') -Raw
          if($guard.Contains('and float(status.get("latest_bar_age_min", 1e9)) <= float(args.max_latest_age_minutes)')){throw 'wall clock remains authoritative'}
          if(-not $guard.Contains('and float(status.get("anchored_latest_bar_age_min", 1e9)) <= float(args.max_latest_age_minutes)')){throw 'anchored contract missing'}

  package:
    needs: [anchored-clock-regressions, windows-cumulative-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package directory
        run: |
          mkdir -p package/RithalTailGuardV6_5_8
          cp rithal_tail_guard_v6_5_8/Install-RithalTailGuardV6_5_8.ps1 package/RithalTailGuardV6_5_8/
          cp rithal_tail_guard_v6_5_8/rithal_tail_guard_v658_freshness.py package/RithalTailGuardV6_5_8/
          cp rithal_tail_guard_v6_5_8/README.md package/RithalTailGuardV6_5_8/
          cp rithal_tail_guard_v6_5_7/rithal_tail_guard_v657_delta.py package/RithalTailGuardV6_5_8/
          cp rithal_tail_guard_v6_5_6/rithal_tail_guard_v656_patch.py package/RithalTailGuardV6_5_8/
      - uses: actions/upload-artifact@v4
        with:
          name: RithalTailGuardV6_5_8
          path: package/RithalTailGuardV6_5_8
          retention-days: 90
          if-no-files-found: error
