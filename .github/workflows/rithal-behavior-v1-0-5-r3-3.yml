name: Rithal Behavior V1.0.5 R3.3

on:
  push:
    branches: [rithal-behavior-v1.0.5-r3.3]
  pull_request:
    paths:
      - 'rithal_behavior_fix_v1_0_5_r3_3/**'
      - '.github/workflows/rithal-behavior-v1-0-5-r3-3.yml'

jobs:
  scorer-infer-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile compatibility bridge and installer patcher
        run: |
          python -m py_compile rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3.py
          python -m py_compile rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3_install_patch.py
      - name: Run scorer/infer and line-ending simulations
        run: |
          python rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3.py --self-test
          python rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3_install_patch.py --self-test
      - name: Assert protected calculation ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3.py').read_text()
          required=(
              'canonical_raw_composite_unchanged',
              'canonical_true_posterior_unchanged',
              'canonical_rank_posterior_unchanged',
              'real_mae_heads_recovered',
              'canonical_edges_reused',
              'invalid_posterior_fails_closed',
              'v105_infer_contract_integration',
          )
          for token in required:
              assert token in text, token
          assert 'result["raw_composite"] =' not in text
          assert 'result["true_regime_probs"] =' not in text
          assert 'result["rank_regime_probs"] =' not in text
          print('calculation ownership contract PASS')
          PY
      - name: Parse robust PowerShell installer
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content rithal_behavior_fix_v1_0_5_r3_3/Install-RithalBehaviorFixV1_0_5_R3_3_R2.ps1 -Raw))

  windows-transactional-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build synthetic active project
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-r33'
          $n=Join-Path $root 'mythos\neural'
          New-Item -ItemType Directory -Force -Path $n|Out-Null
          foreach($name in @('rithal_behavior_fix_v105.py','rithal_behavior_fix_v105_r3.py','rithal_behavior_fix_v105_r3_1.py','rithal_behavior_fix_v105_r3_2.py')){
            "VERSION='$name'`n"|Set-Content (Join-Path $n $name) -Encoding utf8
          }
          @'
          import numpy as np
          class NeuralV2Model: pass
          class LiveEngine:
              CHOP_GATE_THRESHOLD=0.60
              PANIC_GATE_THRESHOLD=0.50
              def _get_regime_probs(self, sym, pred): return pred
              def _log_rich_bar(self, sym, df, last_bar, pred):
                  def L(*args): return args
                  try:
                      _rp = self._get_regime_probs(sym, pred)
                      L("  │ REGIME-P:   p_trend=%.3f  p_chop=%.3f  p_breakout=%.3f   (chop gate %.2f / panic gate %.2f)",
                        _rp.get("p_trend", 0.0), _rp.get("p_chop", 0.0), _rp.get("p_panic", 0.0),
                        self.CHOP_GATE_THRESHOLD, self.PANIC_GATE_THRESHOLD)
                  except Exception:
                      pass
          # RITHAL_CONSOLIDATED_INTELLIGENCE_SAFETY_V1_0_4_1_END
          '@|Set-Content (Join-Path $n 'live.py') -Encoding utf8
      - name: Install R3.3 R2
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-r33'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\rithal_behavior_fix_v1_0_5_r3_3\Install-RithalBehaviorFixV1_0_5_R3_3_R2.ps1 -ProjectRoot $root
      - name: Verify and prove idempotent reinstall
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-r33'
          & (Join-Path $root 'Verify-RithalBehaviorFixV1_0_5_R3_3.ps1') -ProjectRoot $root
          powershell -NoProfile -ExecutionPolicy Bypass -File .\rithal_behavior_fix_v1_0_5_r3_3\Install-RithalBehaviorFixV1_0_5_R3_3_R2.ps1 -ProjectRoot $root
          & (Join-Path $root 'Verify-RithalBehaviorFixV1_0_5_R3_3.ps1') -ProjectRoot $root
          $live=Get-Content (Join-Path $root 'mythos\neural\live.py') -Raw
          if(([regex]::Matches($live,[regex]::Escape('RITHAL_BEHAVIOR_FIX_V1_0_5_R3_3_ACTIVATION_START'))).Count-ne 1){throw 'duplicate activation'}
          if(([regex]::Matches($live,[regex]::Escape('RITHAL_BEHAVIOR_FIX_V1_0_5_R3_3_SAFE_REGIME_LOG'))).Count-ne 1){throw 'duplicate logger patch'}
          if($live.Contains('_rp.get("p_panic", 0.0)')){throw 'panic mislabeled as breakout'}
      - name: Validate install report scope
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-r33'
          $report=Get-Content (Join-Path $root 'mythos_model_instances\rithal-1-0-contract-locked\rithal_behavior_fix_v105_r3_3_install_report.json') -Raw|ConvertFrom-Json
          if($report.checkpoint_files_changed){throw 'checkpoint scope violation'}
          if($report.feature_order_changed){throw 'feature-order scope violation'}
          if($report.raw_composite_changed){throw 'raw-composite scope violation'}
          if($report.true_rank_regime_arrays_changed){throw 'posterior scope violation'}
          if($report.thresholds_changed -or $report.fees_changed -or $report.tp_sl_changed){throw 'economic scope violation'}

  package:
    needs: [scorer-infer-simulation, windows-transactional-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          mkdir -p package/RithalBehaviorFixV1_0_5_R3_3
          cp rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3.py package/RithalBehaviorFixV1_0_5_R3_3/
          cp rithal_behavior_fix_v1_0_5_r3_3/rithal_behavior_fix_v105_r3_3_install_patch.py package/RithalBehaviorFixV1_0_5_R3_3/
          cp rithal_behavior_fix_v1_0_5_r3_3/Install-RithalBehaviorFixV1_0_5_R3_3_R2.ps1 package/RithalBehaviorFixV1_0_5_R3_3/Install-RithalBehaviorFixV1_0_5_R3_3.ps1
          cp rithal_behavior_fix_v1_0_5_r3_3/README.md package/RithalBehaviorFixV1_0_5_R3_3/
      - uses: actions/upload-artifact@v4
        with:
          name: RithalBehaviorFixV1_0_5_R3_3
          path: package/RithalBehaviorFixV1_0_5_R3_3
          retention-days: 90
          if-no-files-found: error
