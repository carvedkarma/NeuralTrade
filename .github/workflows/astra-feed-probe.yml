name: ASTRA Oct5 micro-feed availability probe
on:
  push:
    branches: [astra-oct5-micro-probe-20261010]
    paths: ['.github/workflows/astra-feed-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check independently published quote feeds (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error, json,datetime,hashlib,os,gzip
          from pathlib import Path
          out=Path('probe');out.mkdir(exist_ok=True)
          tests={
              'FXCM_EURUSD_week41':'https://candledata.fxcorporate.com/m1/EURUSD/2026/41.csv.gz',
              'FXCM_EURUSD_week40':'https://candledata.fxcorporate.com/m1/EURUSD/2026/40.csv.gz',
              'FXCM_USDJPY_week41':'https://candledata.fxcorporate.com/m1/USDJPY/2026/41.csv.gz',
              'FXCM_GBPUSD_week41':'https://candledata.fxcorporate.com/m1/GBPUSD/2026/41.csv.gz',
              'DUKA_EURUSD_OCT05':'https://datafeed.dukascopy.com/datafeed/EURUSD/2026/09/05/BID_candles_min_1.bi5',
              'DUKA_EURUSD_OCT06':'https://datafeed.dukascopy.com/datafeed/EURUSD/2026/09/06/BID_candles_min_1.bi5',
              'DUKA_ALT_EURUSD_OCT06':'https://www.dukascopy.com/datafeed/EURUSD/2026/09/06/BID_candles_min_1.bi5',
              'YAHOO_EURUSD_1M':'https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?period1=1791158400&period2=1791590400&interval=1m',
          }
          rows=[]
          for name,url in tests.items():
              r={'test':name,'uri':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ASTRA research audit)'})
                  with urllib.request.urlopen(req,timeout=16) as resp:
                      data=resp.read(22_000_000)
                      r.update(status=resp.status,content_type=resp.headers.get('Content-Type'),size=len(data),sha256=hashlib.sha256(data).hexdigest(),first_100=data[:100].hex())
                      if name.startswith('FXCM') and len(data)>400:
                          try:
                              dec=gzip.decompress(data)
                              r.update(decompressed_bytes=len(dec),header=dec[:260].decode('utf-8','replace'))
                              if b'Bid' in dec[:260] and b'Ask' in dec[:260] and name.endswith('week41'):
                                  (out/(name+'.csv.gz')).write_bytes(data)
                          except Exception as e:r['decode_error']=repr(e)
                      elif name.startswith('YAHOO') and len(data)>100:
                          try:
                              j=json.loads(data)
                              v=j.get('chart',{})
                              ts=(v.get('result') or [{}])[0].get('timestamp') or []
                              r.update(count=len(ts),first_ts=ts[0] if ts else None,last_ts=ts[-1] if ts else None,chart_error=v.get('error'))
                              if ts:(out/'YAHOO_EURUSD_1M.json').write_bytes(data)
                          except Exception as e:r['decode_error']=repr(e)
              except Exception as e:r['error']=str(e)
              rows.append(r)
              print(json.dumps({k:v for k,v in r.items() if k not in ['first_100','uri']},default=str),flush=True)
          (out/'PROBE.json').write_text(json.dumps({'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'no_strategy_execution':True,'probes':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-oct5-data-source-probe
          path: probe/
          if-no-files-found: error
          retention-days: 7
