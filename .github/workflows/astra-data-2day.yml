name: ASTRA 2-day market data
on:
  push:
    branches: [main]
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download native M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p astra_2day_data
          for s in eurusd gbpusd usdjpy gbpjpy audusd usdcad xauusd xagusd; do
            echo "Downloading $s"
            npx --yes dukascopy-node -i "$s" -from 2026-09-22 -to 2026-09-24 -t m1 -f csv > "astra_2day_data/${s}_m1.csv"
            test -s "astra_2day_data/${s}_m1.csv"
          done
      - name: Inventory
        shell: bash
        run: |
          wc -l astra_2day_data/*.csv | tee astra_2day_data/ROW_COUNTS.txt
          sha256sum astra_2day_data/*.csv > astra_2day_data/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-native-m1-20260922-23
          path: astra_2day_data
          if-no-files-found: error
          retention-days: 7
