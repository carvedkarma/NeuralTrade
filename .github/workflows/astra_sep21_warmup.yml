name: ASTRA Sep21 Warmup Data

on:
  push:
    branches: [astra-sep21-warmup-data]
    paths:
      - ".github/workflows/astra_sep21_warmup.yml"

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Dukascopy chart-widget BID M1
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,time,urllib.request,urllib.parse,hashlib
          from datetime import datetime,timezone
          from pathlib import Path

          OUT=Path("astra_sep21_warmup"); OUT.mkdir(exist_ok=True)
          SYMBOLS=["EURUSD","GBPUSD","USDJPY","GBPJPY","AUDUSD","USDCAD","XAUUSD","XAGUSD"]
          HEADERS={"User-Agent":"Mozilla/5.0","Referer":"https://www.dukascopy.com/"}
          end_ms=int(datetime(2026,9,23,tzinfo=timezone.utc).timestamp()*1000)

          def fetch(sym):
              inst=urllib.parse.quote(sym[:3]+"/"+sym[3:])
              url=(f"https://freeserv.dukascopy.com/2.0/index.php?path=chart/json3"
                   f"&instrument={inst}&offer_side=B&interval=1MIN&splits=true&stocks=true"
                   f"&limit=5000&time_direction=P&timestamp={end_ms}&jsonp=_cb")
              last=None
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers=HEADERS)
                      with urllib.request.urlopen(req,timeout=40) as r:
                          txt=r.read().decode("utf-8","replace")
                      payload=json.loads(txt[txt.index("(")+1:txt.rindex(")")])
                      if payload: return payload,url,txt
                  except Exception as e: last=e
                  time.sleep(2*(attempt+1))
              raise RuntimeError(f"widget failed {sym}: {last}")

          manifest={"provider":"Dukascopy chart widget json3","side":"BID","interval":"1MIN","symbols":{}}
          for sym in SYMBOLS:
              payload,url,rawtxt=fetch(sym)
              rows=[]
              for a in payload:
                  if len(a)<5: continue
                  ts=int(a[0]); o,h,l,c=map(float,a[1:5])
                  dt=datetime.fromtimestamp(ts/1000,tz=timezone.utc)
                  if datetime(2026,9,21,tzinfo=timezone.utc) <= dt < datetime(2026,9,23,tzinfo=timezone.utc):
                      rows.append((ts,o,h,l,c))
              rows.sort()
              byday={}
              for datestr in ["2026-09-21","2026-09-22"]:
                  dayrows=[r for r in rows if datetime.fromtimestamp(r[0]/1000,tz=timezone.utc).strftime("%Y-%m-%d")==datestr]
                  p=OUT/f"{sym}_{datestr}_M1.csv"
                  with p.open("w",newline="") as f:
                      w=csv.writer(f); w.writerow(["timestamp","open","high","low","close"]); w.writerows(dayrows)
                  ts=[r[0] for r in dayrows]
                  gaps=[{"after":a,"before":b,"gap_minutes":(b-a)//60000-1} for a,b in zip(ts,ts[1:]) if b-a!=60000]
                  byday[datestr]={"rows":len(dayrows),"start_ms":ts[0] if ts else None,"end_ms":ts[-1] if ts else None,
                    "minute_gaps":gaps,"csv_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
                  if len(dayrows)<1300: raise RuntimeError(f"insufficient {sym} {datestr}: {len(dayrows)}")
              manifest["symbols"][sym]={"source_url":url,"raw_response_sha256":hashlib.sha256(rawtxt.encode()).hexdigest(),**byday}
              print(sym,byday["2026-09-21"]["rows"],byday["2026-09-22"]["rows"],flush=True)
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-sep21-warmup-data
          path: astra_sep21_warmup
          if-no-files-found: error
          retention-days: 7
