name: ASTRA Sep21 Warmup Data

on:
  push:
    branches: [astra-sep21-warmup-data]
    paths:
      - ".github/workflows/astra_sep21_warmup.yml"

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Dukascopy Sep21-22 bid M1
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, lzma, struct, time, urllib.request, urllib.error
          from collections import OrderedDict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          OUT = Path("astra_sep21_warmup")
          OUT.mkdir(exist_ok=True)
          SYMBOLS = ["EURUSD","GBPUSD","USDJPY","GBPJPY","AUDUSD","USDCAD","XAUUSD","XAGUSD"]
          SCALE = {
              "EURUSD":100000.0,"GBPUSD":100000.0,"AUDUSD":100000.0,"USDCAD":100000.0,
              "USDJPY":1000.0,"GBPJPY":1000.0,"XAUUSD":1000.0,"XAGUSD":1000.0,
          }
          REC = struct.Struct(">IIIff")
          BASE = "https://datafeed.dukascopy.com/datafeed/{sym}/{year}/{month0:02d}/{day:02d}/{hour:02d}h_ticks.bi5"
          HEADERS = {"User-Agent":"ASTRA-research-data-acquisition/1.0","Accept":"application/octet-stream,*/*;q=0.8"}

          def get_bytes(url):
              last=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers=HEADERS)
                      with urllib.request.urlopen(req,timeout=30) as r:
                          data=r.read()
                      if len(data) >= 10:
                          return data
                  except Exception as e:
                      last=e
                  time.sleep(0.5*(attempt+1))
              raise RuntimeError(f"download failed {url}: {last}")

          def download_day(sym, day):
              scale=SCALE[sym]
              bars=OrderedDict()
              source_files=[]
              for hour in range(24):
                  dt=datetime(day.year,day.month,day.day,hour,tzinfo=timezone.utc)
                  url=BASE.format(sym=sym,year=day.year,month0=day.month-1,day=day.day,hour=hour)
                  blob=get_bytes(url)
                  try:
                      raw=lzma.decompress(blob)
                  except Exception as e:
                      raise RuntimeError(f"LZMA decode failed {url}: {e}")
                  if len(raw)%REC.size:
                      raise RuntimeError(f"bad record bytes {url}: {len(raw)}")
                  source_files.append({"url":url,"bytes":len(blob),"sha256":hashlib.sha256(blob).hexdigest()})
                  for off in range(0,len(raw),REC.size):
                      ms, ask_i, bid_i, avol, bvol = REC.unpack_from(raw,off)
                      ts=dt+timedelta(milliseconds=ms)
                      minute=ts.replace(second=0,microsecond=0)
                      bid=bid_i/scale
                      k=int(minute.timestamp()*1000)
                      if k not in bars:
                          bars[k]=[bid,bid,bid,bid]
                      else:
                          b=bars[k]
                          if bid>b[1]: b[1]=bid
                          if bid<b[2]: b[2]=bid
                          b[3]=bid
              rows=[(k,*v) for k,v in sorted(bars.items())]
              return rows, source_files

          manifest={"provider":"Dukascopy datafeed hourly tick .bi5","side":"BID","generated_utc":datetime.now(timezone.utc).isoformat(),"symbols":{}}
          for sym in SYMBOLS:
              manifest["symbols"][sym]={}
              for datestr in ["2026-09-21","2026-09-22"]:
                  day=datetime.fromisoformat(datestr).replace(tzinfo=timezone.utc)
                  rows, files=download_day(sym,day)
                  path=OUT/f"{sym}_{datestr}_M1.csv"
                  with path.open("w",newline="") as f:
                      w=csv.writer(f)
                      w.writerow(["timestamp","open","high","low","close"])
                      w.writerows(rows)
                  ts=[r[0] for r in rows]
                  gaps=[]
                  for a,b in zip(ts,ts[1:]):
                      if b-a != 60000:
                          gaps.append({"after":a,"before":b,"gap_minutes":(b-a)//60000-1})
                  manifest["symbols"][sym][datestr]={
                      "rows":len(rows),
                      "start_ms":ts[0] if ts else None,
                      "end_ms":ts[-1] if ts else None,
                      "minute_gaps":gaps,
                      "csv_sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
                      "source_hour_files":files
                  }
                  if len(rows) < 1300:
                      raise RuntimeError(f"too few M1 rows for {sym} {datestr}: {len(rows)}")
              print(sym, manifest["symbols"][sym]["2026-09-21"]["rows"], manifest["symbols"][sym]["2026-09-22"]["rows"])
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-sep21-warmup-data
          path: astra_sep21_warmup
          if-no-files-found: error
          retention-days: 7
