name: Rithal Tail Guard V6.5.3 R2

on:
  push:
    branches: [rithal-tail-guard-v6.5.1]
  pull_request:
    paths:
      - 'rithal_tail_guard_v6_5_1/Install-RithalTailGuardV6_5_3_R2.ps1'
      - 'rithal_tail_guard_v6_5_1/rithal_tail_guard_premium_fix_v653*.py'
      - '.github/workflows/rithal-tail-guard-v6-5-3-r2.yml'

jobs:
  wrapper-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - run: python -m py_compile rithal_tail_guard_v6_5_1/rithal_tail_guard_premium_fix_v653.py rithal_tail_guard_v6_5_1/rithal_tail_guard_premium_fix_v653_r2.py
      - run: python rithal_tail_guard_v6_5_1/rithal_tail_guard_premium_fix_v653_r2.py --self-test
      - name: Confirm canonical path without active guard import
        run: |
          python rithal_tail_guard_v6_5_1/rithal_tail_guard_premium_fix_v653_r2.py --list-premium-paths --data-root /tmp/data_lake --symbols BTCUSDT,ETHUSDT | tee /tmp/paths.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/paths.json'))
          assert p['BTCUSDT'].endswith('/data_lake/raw/binance_um/premium_15m/BTCUSDT.parquet')
          assert p['ETHUSDT'].endswith('/data_lake/raw/binance_um/premium_15m/ETHUSDT.parquet')
          print('canonical resolver PASS')
          PY
      - name: Parse installer
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content rithal_tail_guard_v6_5_1/Install-RithalTailGuardV6_5_3_R2.ps1 -Raw))'

  windows-no-guard-import-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - name: Build project whose guard raises if imported
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-v653-r2-pass'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'mythos'),(Join-Path $root 'data_lake\manifests'),(Join-Path $root 'data_lake\raw\binance_um\premium_15m')|Out-Null
          @'
          import numpy as np
          import pandas as pd
          def _numeric(df,col,default=0.0): return pd.to_numeric(df[col],errors='coerce').fillna(default)
          def _z(s,n): return s*0.0
          class V22DataEngine:
              def build(self,df):
                  # RITHAL_TAIL_GUARD_V6_5_1_PREMIUM_ALIGNMENT
                  _premium_close_raw=(pd.to_numeric(df["premium_index_close"],errors="coerce") if "premium_index_close" in df.columns else pd.Series(np.nan,index=df.index,dtype=float)).replace([np.inf,-np.inf],np.nan)
                  df["premium_index_close"]=_premium_close_raw.fillna(0.0)
                  df["premium_index_change_1h"]=(
                      _premium_close_raw.pct_change(periods=4,fill_method=None)
                      .replace([np.inf,-np.inf],0.0)
                      .fillna(0.0)
                  )
                  df["premium_index_z_7d"]=_z(
                      _premium_close_raw.ffill().fillna(0.0),7*96
                  )
                  return df
          '@|Set-Content (Join-Path $root 'mythos\data_engine_v22.py') -Encoding utf8
          @'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          BAR_15M_MS=900000
          if __name__ != '__main__':
              raise RuntimeError('ACTIVE GUARD MUST NOT BE IMPORTED BY INSTALLER')
          def fetch_binance_premium(client, symbol, start_ms, end_open_ms) -> pd.DataFrame:
              cursor = int(start_ms)
              rows=[]
              out=pd.DataFrame(rows)
              out["premium_index_change_1h"]=(
                  out["premium_index_close"].pct_change(periods=4,fill_method=None)
                  .replace([np.inf,-np.inf],0.0)
                  .fillna(0.0)
              )
              return out
          def main(): pass
          '@|Set-Content (Join-Path $root 'mythos_live_tail_guard_v6_6.py') -Encoding utf8
          @'
          param([string]$ProjectRoot=$PSScriptRoot,[switch]$Background,[switch]$NoRunNow,[switch]$Once,[switch]$Bootstrap)
          if($Background){exit 0}
          if($Once){
            $d=Join-Path $ProjectRoot 'data_lake\manifests';New-Item -ItemType Directory -Force -Path $d|Out-Null
            @{publication='COMMITTED';tail_feature_contract_ok=$true}|ConvertTo-Json|Set-Content (Join-Path $d 'live_tail_guard_v6_5_report.json') -Encoding utf8
            Write-Host 'Publication: COMMITTED | 96-row contract: PASS';exit 0
          }
          '@|Set-Content (Join-Path $root 'Start-RithalTailWatch.ps1') -Encoding utf8
          @'
          from pathlib import Path
          import numpy as np,pandas as pd,sys
          r=Path(sys.argv[1]); out=r/'data_lake'/'raw'/'binance_um'/'premium_15m'
          c=pd.Series(np.linspace(.001,.004,80)+np.sin(np.arange(80))*.0002)
          canonical=c.pct_change(4,fill_method=None).replace([np.inf,-np.inf],0).fillna(0)
          stale=canonical.copy()
          for start in range(0,80,12):
              x=c.iloc[start:start+12]
              stale.iloc[start:start+12]=x.pct_change(4,fill_method=None).replace([np.inf,-np.inf],0).fillna(0).to_numpy()
          for s in 'BTCUSDT ETHUSDT SOLUSDT XRPUSDT ADAUSDT AVAXUSDT'.split():
              pd.DataFrame({'timestamp':np.arange(80,dtype=np.int64)*900000,'premium_index_close':c,'premium_source_covered':1.0,'premium_index_change_1h':stale}).to_parquet(out/f'{s}.parquet',index=False)
          '@|Set-Content (Join-Path $root 'make_stale.py') -Encoding utf8
          python (Join-Path $root 'make_stale.py') $root
      - name: Install R2 and verify
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rithal-v653-r2-pass'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\rithal_tail_guard_v6_5_1\Install-RithalTailGuardV6_5_3_R2.ps1 -ProjectRoot $root
          & (Join-Path $root 'Verify-RithalTailGuardV6_5_3_R2.ps1') -ProjectRoot $root
          python -c "from pathlib import Path; import pandas as pd,numpy as np; p=Path(r'$root')/'data_lake'/'raw'/'binance_um'/'premium_15m'/'BTCUSDT.parquet'; d=pd.read_parquet(p); e=d.premium_index_close.pct_change(4,fill_method=None).replace([np.inf,-np.inf],0).fillna(0); assert np.array_equal(d.premium_index_change_1h.to_numpy(),e.to_numpy()); print('R2 canonical state PASS')"
