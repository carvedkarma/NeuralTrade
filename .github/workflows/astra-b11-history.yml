name: ASTRA B11 4-month BIDASK M1
on:
  push:
    branches: [astra-b11-history-20260926]

jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        symbol: [eurusd, gbpusd, usdjpy, gbpjpy, audusd, usdcad, xauusd, xagusd]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download BID and ASK native M1
        shell: bash
        run: |
          set -euo pipefail
          s="${{ matrix.symbol }}"
          out="astra_b11_history/${s}"
          mkdir -p "${out}"
          for side in bid ask; do
            echo "Downloading ${s} ${side}"
            npx --yes dukascopy-node \
              -i "${s}" \
              -from 2026-06-01 \
              -to 2026-09-26 \
              -t m1 \
              -p "${side}" \
              -v \
              -fl \
              -f csv \
              -dir "${out}" \
              -fn "${s}_${side}_m1" \
              --batch-size 8 \
              --batch-pause 800
          done
      - name: Validate and inventory without filling gaps
        shell: bash
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          s="${{ matrix.symbol }}"
          out="astra_b11_history/${s}"
          test "$(find "${out}" -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 2
          for f in "${out}"/*.csv; do
            rows="$(wc -l < "${f}")"
            echo "${f}: ${rows} lines"
            test "${rows}" -gt 50000
          done
          python - <<'PY' > "${out}/ALIGNMENT_AUDIT.json"
          import csv, json, os
          from pathlib import Path
          s=os.environ["SYMBOL"]
          out=Path("astra_b11_history")/s
          def load(side):
              p=out/f"{s}_{side}_m1.csv"
              ts=[]
              with p.open(newline="") as fh:
                  for r in csv.DictReader(fh):
                      ts.append(int(float(r["timestamp"])))
              assert ts==sorted(ts), f"{side} not monotonic"
              assert len(ts)==len(set(ts)), f"{side} duplicate timestamps"
              return ts
          b=load("bid"); a=load("ask")
          bs=set(b); aset=set(a); common=bs & aset
          audit={
              "symbol":s,
              "bid_rows":len(b),
              "ask_rows":len(a),
              "common_rows":len(common),
              "bid_only":len(bs-aset),
              "ask_only":len(aset-bs),
              "overlap_vs_smaller":len(common)/min(len(b),len(a)),
              "overlap_vs_larger":len(common)/max(len(b),len(a)),
              "bid_start":b[0],"bid_end":b[-1],
              "ask_start":a[0],"ask_end":a[-1],
              "gap_policy":"NO_FILL_INNER_ALIGNMENT_AT_EXECUTION"
          }
          print(json.dumps(audit,indent=2))
          PY
          cat "${out}/ALIGNMENT_AUDIT.json"
          wc -l "${out}"/*.csv > "${out}/ROW_COUNTS.txt"
          sha256sum "${out}"/*.csv > "${out}/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: astra-b11-${{ matrix.symbol }}-bidask-m1-flats-20260601-20260925
          path: astra_b11_history/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 7
