name: ASTRA B11 4-month BIDASK M1
on:
  push:
    branches: [astra-b11-history-20260926]

jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        symbol: [eurusd, gbpusd, usdjpy, gbpjpy, audusd, usdcad, xauusd, xagusd]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download BID and ASK native M1
        shell: bash
        run: |
          set -euo pipefail
          s="${{ matrix.symbol }}"
          out="astra_b11_history/${s}"
          mkdir -p "${out}"
          for side in bid ask; do
            echo "Downloading ${s} ${side}"
            npx --yes dukascopy-node \
              -i "${s}" \
              -from 2026-06-01 \
              -to 2026-09-26 \
              -t m1 \
              -p "${side}" \
              -v \
              -fl \
              -f csv \
              -dir "${out}" \
              -fn "${s}_${side}_m1" \
              --batch-size 8 \
              --batch-pause 800
          done
      - name: Validate and inventory
        shell: bash
        run: |
          set -euo pipefail
          s="${{ matrix.symbol }}"
          out="astra_b11_history/${s}"
          test "$(find "${out}" -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 2
          for f in "${out}"/*.csv; do
            rows="$(wc -l < "${f}")"
            echo "${f}: ${rows} lines"
            test "${rows}" -gt 50000
          done
          python - <<'PY'
import pandas as pd
from pathlib import Path
import os
s=os.environ["SYMBOL"]
out=Path("astra_b11_history")/s
b=pd.read_csv(out/f"{s}_bid_m1.csv")
a=pd.read_csv(out/f"{s}_ask_m1.csv")
assert list(b["timestamp"]) == list(a["timestamp"]), f"BID/ASK timestamp mismatch for {s}"
assert len(b)==len(a)
assert ((a[["open","high","low","close"]].to_numpy() - b[["open","high","low","close"]].to_numpy()) >= -1e-12).all(), f"negative spread detected for {s}"
print(f"{s}: aligned rows={len(b)}")
PY
          wc -l "${out}"/*.csv > "${out}/ROW_COUNTS.txt"
          sha256sum "${out}"/*.csv > "${out}/SHA256SUMS.txt"
        env:
          SYMBOL: ${{ matrix.symbol }}
      - uses: actions/upload-artifact@v4
        with:
          name: astra-b11-${{ matrix.symbol }}-bidask-m1-flats-20260601-20260925
          path: astra_b11_history/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 7
