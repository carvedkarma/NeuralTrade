name: ASTRA BTC ETH fresh 2d
on:
  push:
    branches: [main]
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Binance public-data archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p astra_btceth_fresh2d/raw
          BASE=https://data.binance.vision/data/futures/um/daily
          for d in 2026-09-22 2026-09-23; do
            for s in BTCUSDT ETHUSDT; do
              for spec in "klines/$s/5m/$s-5m-$d.zip" "aggTrades/$s/$s-aggTrades-$d.zip" "metrics/$s/$s-metrics-$d.zip" "premiumIndexKlines/$s/5m/$s-5m-$d.zip"; do
                u="$BASE/$spec"; o="astra_btceth_fresh2d/raw/$(basename "$u")"
                echo "$u"
                curl -fL --retry 3 "$u" -o "$o"
              done
            done
          done
          sha256sum astra_btceth_fresh2d/raw/* > astra_btceth_fresh2d/SHA256SUMS.txt
          ls -lh astra_btceth_fresh2d/raw
      - uses: actions/upload-artifact@v4
        with:
          name: astra-btceth-official-binance-20260922-23
          path: astra_btceth_fresh2d
          if-no-files-found: error
          retention-days: 7
